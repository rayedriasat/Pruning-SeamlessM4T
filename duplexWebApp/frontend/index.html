<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duplex Conversation — SeamlessM4T</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #151b23;
        --panel-2: #0f141b;
        --line: #273241;
        --fg: #eef3f8;
        --muted: #99a5b5;
        --accent: #39b6ff;
        --accent-strong: #168fd6;
        --accent2: #ff7a66;
        --ok: #57d987;
        --warn: #f8c45f;
        --danger: #ef5f5f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background:
          radial-gradient(circle at 20% 0%, rgba(57, 182, 255, 0.14), transparent 30rem),
          linear-gradient(180deg, #0d1219 0%, var(--bg) 52%);
        color: var(--fg);
        font:
          15px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 18px 12px;
      }
      .shell {
        width: min(860px, 100%);
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-end;
        margin-bottom: 12px;
      }
      h1 {
        font-size: clamp(20px, 3vw, 28px);
        font-weight: 750;
        margin: 0 0 3px;
        letter-spacing: 0;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
        max-width: 650px;
      }
      .panel {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .topbar {
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .actions {
        justify-content: flex-end;
      }
      .controls {
        display: grid;
        grid-template-columns: minmax(170px, 0.72fr) minmax(240px, 1fr);
        gap: 10px;
        align-items: stretch;
        margin-bottom: 12px;
      }
      .control-block {
        background: var(--panel-2);
        border: 1px solid #202a38;
        border-radius: 8px;
        padding: 10px;
      }
      .label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      select {
        width: 100%;
        appearance: none;
        background: #111822;
        color: var(--fg);
        border: 1px solid #2a3748;
        border-radius: 8px;
        padding: 8px 34px 8px 10px;
        font: inherit;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--muted) 50%),
          linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) 50%,
          calc(100% - 13px) 50%;
        background-size: 5px 5px;
        background-repeat: no-repeat;
      }
      button {
        background: #202a38;
        color: var(--fg);
        border: 1px solid #314057;
        padding: 8px 13px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        transition:
          transform 0.12s ease,
          border-color 0.12s ease,
          background 0.12s ease;
      }
      button:hover:not(:disabled) {
        background: #2a3648;
        transform: translateY(-1px);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: linear-gradient(180deg, #1b9eeb, var(--accent-strong));
        border-color: #54c4ff;
        color: white;
      }
      button.danger {
        background: #3a2025;
        border-color: #7a3439;
        color: #ffd8d8;
      }
      .mode-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .mode-card {
        position: relative;
        display: block;
      }
      .mode-card input {
        position: absolute;
        opacity: 0;
      }
      .mode-card span {
        display: flex;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        text-align: center;
        border: 1px solid #2a3748;
        border-radius: 8px;
        background: #121923;
        color: var(--muted);
        font-weight: 700;
        padding: 6px 8px;
        cursor: pointer;
      }
      .mode-card input:checked + span {
        color: #eaf8ff;
        background: rgba(57, 182, 255, 0.13);
        border-color: var(--accent);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 210px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--panel-2);
        border: 1px solid #202a38;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.listening {
        background: var(--ok);
        box-shadow: 0 0 12px var(--ok);
      }
      .dot.you {
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
        animation: pulse 1.1s infinite;
      }
      .dot.thinking {
        background: var(--warn);
        animation: pulse 0.8s infinite;
      }
      .dot.bot {
        background: var(--accent2);
        box-shadow: 0 0 12px var(--accent2);
        animation: pulse 0.6s infinite;
      }
      .dot.error {
        background: #f55;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .meter {
        flex: 1;
        height: 5px;
        background: #0a0f15;
        border-radius: 3px;
        overflow: hidden;
      }
      .meter > i {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--ok), var(--accent2));
        transition: width 0.05s linear;
      }
      .mic-button {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid #33506a;
        background:
          radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.16), transparent 34%),
          linear-gradient(180deg, #1e5878, #143349);
        color: white;
        display: grid;
        place-items: center;
        padding: 0;
        flex: 0 0 auto;
      }
      .mic-button svg {
        width: 19px;
        height: 19px;
      }
      .mic-button.active,
      body.mic-open .mic-button:not(:disabled) {
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.2), transparent 35%),
          linear-gradient(180deg, #24be72, #16844f);
        border-color: #73ecaa;
        box-shadow: 0 0 0 4px rgba(87, 217, 135, 0.12);
      }

      #log {
        max-height: min(290px, 42vh);
        overflow: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        background: #080c11;
        border: 1px solid #202a38;
        border-radius: 8px;
        padding: 10px;
      }
      #log div {
        white-space: pre-wrap;
      }
      #log .ev-user_speech_start {
        color: var(--accent);
      }
      #log .ev-speaking_start {
        color: var(--accent2);
      }
      #log .ev-thinking {
        color: var(--warn);
      }
      #log .ev-error {
        color: #f55;
      }
      #log .ev-stop_playback,
      #log .ev-speaking_cancelled {
        color: #f99;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }
      @media (max-width: 720px) {
        header {
          align-items: stretch;
          flex-direction: column;
        }
        .topbar {
          align-items: flex-start;
        }
        .actions {
          width: 100%;
        }
        .controls {
          grid-template-columns: 1fr;
        }
        .status {
          min-width: 0;
          flex: 1 1 210px;
        }
      }
      @media (max-width: 480px) {
        body {
          padding: 10px;
        }
        .panel {
          padding: 10px;
        }
        .topbar,
        .actions {
          gap: 6px;
        }
        button {
          padding: 7px 10px;
        }
        .mic-button {
          width: 38px;
          height: 38px;
        }
        .mode-card span {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <h1>Duplex Conversation</h1>
          <div class="sub">
            English speech in, translated speech out. Hold the mic when you want
            to speak, or switch to always-listen for hands-free conversation.
          </div>
        </div>
      </header>

      <div class="panel">
        <div class="row topbar">
          <div class="status">
            <span id="dot" class="dot"></span>
            <strong id="state">idle</strong>
            <div class="meter"><i id="meter"></i></div>
          </div>
          <div class="row actions">
            <button id="holdTalk" class="mic-button" disabled aria-label="Hold to talk" aria-pressed="false" title="Hold to talk">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 0-2 0 3 3 0 1 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V19H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-3.1A5 5 0 0 0 17 11Z" />
              </svg>
            </button>
            <button id="start" class="primary">Start call</button>
            <button id="stop" class="danger" disabled>Stop</button>
            <button id="reset" disabled>Reset</button>
          </div>
        </div>

        <div class="controls">
          <div class="control-block">
            <label class="label" for="lang">Translate to</label>
            <select id="lang">
              <option value="ben">Bengali</option>
              <option value="hin">Hindi</option>
              <option value="arb">Arabic</option>
              <option value="cmn">Chinese</option>
              <option value="eng">English</option>
            </select>
          </div>

          <div class="control-block">
            <span class="label">Mic mode</span>
            <div class="mode-group">
              <label class="mode-card">
                <input type="radio" name="talkMode" value="push" checked />
                <span>Push to talk</span>
              </label>
              <label class="mode-card">
                <input type="radio" name="talkMode" value="always" />
                <span>Always listen</span>
              </label>
            </div>
          </div>
        </div>

        <div id="log"></div>
        <div class="hint">
          Tip: use headphones. Echo cancellation helps, but speakers can still
          leak into the mic during always-listen mode.
        </div>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
